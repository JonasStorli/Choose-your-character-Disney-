<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Selection (No JS)</title>
  <link rel="stylesheet" href="Page2.css"> <!-- Link to the CSS file -->
  <link rel="stylesheet" href="/styles-page2.css">
</head>
<body>

  <h1 class="heading">Character Selection</h1>

  <div class="character-selection-container">

    <!-- Radio buttons for character selection -->
    <input type="radio" name="character" id="char1" checked>
    <input type="radio" name="character" id="char2">
    <input type="radio" name="character" id="char3">
    <input type="radio" name="character" id="char4">
    <input type="radio" name="character" id="char5">
    <input type="radio" name="character" id="char6">

    <!-- Labels with images that are connected to radio buttons -->
    <div class="character-display">
      <label for="char1" class="character"><img src="character1.png" alt="Character 1"></label>
      <label for="char2" class="character"><img src="character2.png" alt="Character 2"></label>
      <label for="char3" class="character"><img src="character3.png" alt="Character 3"></label>
      <label for="char4" class="character"><img src="character4.png" alt="Character 4"></label>
      <label for="char5" class="character"><img src="character5.png" alt="Character 5"></label>
      <label for="char6" class="character"><img src="character6.png" alt="Character 6"></label>
    </div>
  
  </div>
  <div class="wrapper">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div class="banner">
    <div class="content">
    </div>
</body>
</html>
