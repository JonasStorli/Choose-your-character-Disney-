<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /> <!-- Setter tegnsett til UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Responsiv design -->
    <link rel="stylesheet" href="/da-css/Page1.css" /> <!-- Kobler til første CSS-fil -->
    <link rel="stylesheet" href="/da-css/styles-page1.css" /> <!-- Kobler til andre CSS-fil -->
    <title>3x3 Image Grid</title> <!-- Tittel på siden -->
</head>
<body>
    <div class="h1container"><h1>Marvel Characters</h1></div> <!-- Topptekst med tittel -->

    <div class="container"> <!-- Beholder for grid -->
        <div class="grid"> <!-- Grid for bildene -->
            <img class="grid-img" id="img1" src="/images/Blackpanther.png" alt="Black Panther" /> <!-- Bilde av Black Panther -->
            <img class="grid-img" id="img2" src="/images/CaptainAmerica.png" alt="Captain America" /> <!-- Bilde av Captain America -->
            <img class="grid-img" id="img3" src="/images/CaptainMarvel.png" alt="Captain Marvel" /> <!-- Bilde av Captain Marvel -->
            <img class="grid-img" id="img4" src="/images/Hulk.png" alt="Hulk" /> <!-- Bilde av Hulk -->
            <img class="grid-img" id="img5" src="/images/Ironman.png" alt="Ironman" /> <!-- Bilde av Ironman -->
            <img class="grid-img" id="img6" src="/images/Spiderman.png" alt="Spiderman" /> <!-- Bilde av Spiderman -->
            <img class="grid-img" id="img7" src="/images/Thanos.png" alt="Thanos" /> <!-- Bilde av Thanos -->
            <img class="grid-img" id="img8" src="/images/Thor.png" alt="Thor" /> <!-- Bilde av Thor -->
            <img class="grid-img" id="img9" src="/images/venom.png" alt="Venom" /> <!-- Bilde av Venom -->
        </div>
    </div>

    <div id="ironman"><img src="/pngs/flyingironman.png" alt="iron man goes swosh" /> <!-- Animasjon av Ironman --> </div>
    <div id="minihulk"><img src="/pngs/minihulk.png" alt="" /> <!-- Animasjon av Mini Hulk --> </div>
    <div id="hangingspider"><img src="/pngs/hangingspiderman.png" alt=""> <!-- Animasjon av hengende Spiderman --> </div>

    <div class="center-button-container"> <!-- Beholder for knapp -->
        <a href="Page2.html" class="button">Try</a> <!-- Knapp som leder til Page2 -->
        <div class="background"> <!-- Bakgrunn for knappen (kan være skjult eller dekorativ) -->
        </div>
    </div>

    <div class="wrapper"> <!-- Beholder for animerte elementer -->
        <span></span> <!-- Animerte elementer (for effekter) -->
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="banner"> <!-- Banner for ekstra innhold -->
        <div class="content"></div> <!-- Innhold i banner (kan være tomt) -->
    </div>
</body>
</html>
